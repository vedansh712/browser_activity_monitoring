<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Daily</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="hud-scanlines">
  <div class="popup-container">

    <div class="header">
      <h1 class="logo">TRACK<span>/</span>DAILY</h1>
      <label class="hud-switch">
        <input type="checkbox" id="tracking-toggle" checked aria-label="Toggle tracking">
        <span class="track"></span>
      </label>
    </div>

    <!-- Live session -->
    <div class="current-session">
      <div class="session-status">
        <span class="hud-dot" id="pulse-dot"></span>
        <span class="session-domain" id="current-domain">Not tracking</span>
      </div>
      <span class="session-time hud-num" id="current-time">00:00:00</span>
    </div>

    <!-- Today -->
    <div class="today-block">
      <div class="today-left">
        <div class="hud-label">Today</div>
        <div class="today-total hud-num" id="total-time">0m</div>
        <div class="today-meta hud-label" id="today-meta"></div>
      </div>
      <div class="chart-holder">
        <canvas id="category-chart" width="132" height="132"></canvas>
        <div class="chart-mid">
          <b class="hud-num" id="focus-score">--</b>
          <span class="hud-label">FOCUS</span>
        </div>
      </div>
    </div>

    <!-- Top sites -->
    <div class="top-domains">
      <div class="hud-title">Top Sites</div>
      <ul id="domain-list">
        <li class="hud-empty">NO DATA YET</li>
      </ul>
    </div>

    <!-- Uncategorized prompt -->
    <div class="uncategorized-notice" id="uncategorized-notice" hidden>
      <div class="notice-header">
        <span class="hud-label">CATEGORIZE</span>
        <strong class="hud-num" id="uncat-domain"></strong>
      </div>
      <div class="category-buttons" id="category-buttons"></div>
    </div>

    <div class="footer">
      <button class="hud-btn is-active" id="open-dashboard">Dashboard</button>
      <button class="hud-btn" id="open-options">Settings</button>
    </div>

  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
